<div class="scroll-progress" aria-hidden="true"></div>

<app-navbar></app-navbar>
<main>
  <app-hero></app-hero>

  <div class="ribbons" aria-hidden="true">
    <div class="ribbon ribbon-a marquee">
      @for (n of [0, 1]; track n) {
        <div class="marquee-track">
          @for (w of ribbonWords; track w) {
            <span>{{ w }}</span><span class="star">✦</span>
          }
        </div>
      }
    </div>
    <div class="ribbon ribbon-b marquee reverse">
      @for (n of [0, 1]; track n) {
        <div class="marquee-track">
          @for (w of ribbonWords2; track w) {
            <span>{{ w }}</span><span class="star">✺</span>
          }
        </div>
      }
    </div>
  </div>

  <app-projects></app-projects>
  <app-about></app-about>
  <app-skills></app-skills>
  <app-journey></app-journey>
  <app-contact></app-contact>
</main>

<footer class="site-footer">
  <a class="to-top" href="#hero">
    <span class="to-top-icon" aria-hidden="true">↑</span>
    Volver arriba
  </a>
  <div class="footer-row">
    <p>© {{ year }} Andrea Olivera Romero</p>
    <p>Hecho a mano con Angular + GSAP · WCAG 2.1 AA</p>
  </div>
</footer>
