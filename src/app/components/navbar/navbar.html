<nav [class.scrolled]="scrolled" [class.hidden]="hidden && !menuOpen" [class.menu-open]="menuOpen" aria-label="Principal">
  <a class="logo" href="#hero" aria-label="aonweb, inicio">
    <span class="logo-text" aria-hidden="true">aon<em>web</em></span>
  </a>

  <ul class="links" [class.open]="menuOpen">
    @for (l of links; track l.id; let i = $index) {
      <li [style.--i]="i">
        <a [href]="'#' + l.id" [class.active]="activeSection === l.id" (click)="closeMenu()">
          <span class="num" aria-hidden="true">0{{ i + 1 }}</span>{{ l.label }}
        </a>
      </li>
    }
    <span class="nav-indicator" aria-hidden="true"></span>
  </ul>

  <a class="nav-cta" href="mailto:andreaonweb.dev@gmail.com">
    <svg class="cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20.5l1.5-4.6A8.4 8.4 0 1 1 21 11.5z" />
      <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" />
    </svg>Hablemos
  </a>

  <button class="nav-toggle" type="button" [class.open]="menuOpen" (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen" [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'">
    <span></span>
    <span></span>
  </button>
</nav>
