<section id="projects">
  <h2>Proyectos destacados</h2>

  <div class="carousel" (mouseenter)="stopAutoplay()" (mouseleave)="startAutoplay()">
    <button type="button" class="arrow arrow-left" (click)="onPrev()" aria-label="Proyectos anteriores">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <div class="carousel-viewport">
      <div class="carousel-track" appScrollReveal appScrollRevealStagger=".card"
        [style.transform]="'translateX(-' + (currentPage() * 100) + '%)'">
        <div class="carousel-page" *ngFor="let page of slides; trackBy: trackByPageIndex">
          <ng-container *ngFor="let p of page; trackBy: trackByProjectName">

            <div class="card" *ngIf="p; else ctaTpl">

              <div class="card-preview">
                <span class="type-tag" [class.collab]="p.type === 'Colaborativo'">{{ p.type }}</span>
                <img [src]="p.image" [alt]="'Captura de ' + p.name" loading="lazy" />
              </div>

              <div class="card-header">
                <svg *ngIf="p.icon === 'social'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
                <svg *ngIf="p.icon === 'paws'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 5.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" />
                  <path d="M18 5.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" />
                  <path d="M7 10.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" />
                  <path d="M21 10.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" />
                  <path d="M12 13c-3 0-6 2-6 4.5C6 20 8.5 22 12 22s6-2 6-4.5C18 15 15 13 12 13z" />
                </svg>
                <svg *ngIf="p.icon === 'chat'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16v12H8l-4 4V4z" />
                  <line x1="8" y1="9" x2="16" y2="9" />
                  <line x1="8" y1="13" x2="13" y2="13" />
                </svg>
                <svg *ngIf="p.icon === 'controller'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M7 8h10a4 4 0 0 1 4 4.5l-.6 3a2.4 2.4 0 0 1-4.2 1.1L15 15H9l-1.2 1.6a2.4 2.4 0 0 1-4.2-1.1l-.6-3A4 4 0 0 1 7 8z" />
                  <line x1="7.5" y1="11" x2="7.5" y2="14" />
                  <line x1="6" y1="12.5" x2="9" y2="12.5" />
                  <circle cx="16" cy="11" r="0.8" fill="currentColor" stroke="none" />
                  <circle cx="18" cy="13" r="0.8" fill="currentColor" stroke="none" />
                </svg>
                <svg *ngIf="p.icon === 'cake'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 21v-7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7" />
                  <path d="M4 21h16" />
                  <path d="M4 17c1.2-1 2.4 1 3.6 0s2.4-1 3.6 0 2.4 1 3.6 0 2.4-1 3.2 0" />
                  <line x1="12" y1="12" x2="12" y2="7" />
                  <path d="M12 7c-1 0-1.5-.7-1.5-1.5S11 4 12 3c1 1 1.5 1.7 1.5 2.5S13 7 12 7z" />
                </svg>
                <svg *ngIf="p.icon === 'code'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 8 4 12 9 16" />
                  <polyline points="15 8 20 12 15 16" />
                </svg>
                <svg *ngIf="p.icon === 'calendar'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="16" rx="2" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                  <line x1="8" y1="3" x2="8" y2="7" />
                  <line x1="16" y1="3" x2="16" y2="7" />
                  <line x1="7.5" y1="14" x2="7.5" y2="14.01" />
                  <line x1="12" y1="14" x2="12" y2="14.01" />
                  <line x1="16.5" y1="14" x2="16.5" y2="14.01" />
                </svg>
                <svg *ngIf="p.icon === 'medical'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <line x1="12" y1="8" x2="12" y2="16" />
                  <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
                <svg *ngIf="p.icon === 'quote'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 8c-1.7 0-3 1.3-3 3v2c0 1.1.9 2 2 2h2v-4H6c0-1.1.9-2 2-2V8h-1z" />
                  <path d="M16 8c-1.7 0-3 1.3-3 3v2c0 1.1.9 2 2 2h2v-4h-2c0-1.1.9-2 2-2V8h-1z" />
                </svg>
                <span class="name">{{ p.name }}</span>
                <span class="badge" *ngIf="p.badge">{{ p.badge }}</span>
              </div>

              <p class="desc">{{ p.description }}</p>

              <div class="tech-list">
                <span *ngFor="let t of p.tech">{{ t }}</span>
              </div>

              <div class="view-links">
                <a class="view-link" [href]="p.vercel || p.repos[0].url" target="_blank" rel="noopener">
                  {{ p.vercel ? 'Ver demo' : 'Ver repo' }} <span aria-hidden="true">&rarr;</span>
                </a>
                <div class="repo-links" *ngIf="p.repos.length > 1 || p.vercel">
                  <a class="repo-link" *ngFor="let r of p.repos" [href]="r.url" target="_blank" rel="noopener">
                    {{ r.label }}
                  </a>
                </div>
              </div>

            </div>

            <ng-template #ctaTpl>
              <a class="card cta-card" href="https://github.com/andreaonweb" target="_blank" rel="noopener">
                <svg class="gh-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                  <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                </svg>
                <h3>¿Quieres ver más?</h3>
                <p>Cotillea mi GitHub, ahí subo de todo un poco.</p>
                <span class="gh-link">Ver GitHub ↗</span>
              </a>
            </ng-template>

          </ng-container>
        </div>
      </div>
    </div>

    <button type="button" class="arrow arrow-right" (click)="onNext()" aria-label="Siguientes proyectos">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>

  <div class="dots">
    <button type="button" *ngFor="let page of slides; let i = index; trackBy: trackByPageIndex" class="dot" [class.active]="i === currentPage()"
      (click)="goTo(i)" [attr.aria-label]="'Ir a la página ' + (i + 1)"></button>
  </div>
</section>
