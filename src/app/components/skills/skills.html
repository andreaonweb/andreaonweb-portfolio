<section id="skills">
  <div class="section-head" appScrollReveal>
    <span class="kanji-bg" aria-hidden="true">技</span>
    <span class="eyebrow">03 · Herramientas</span>
    <h2>Mi <em>stack</em></h2>
  </div>

  <div class="tabs" role="tablist" aria-label="Categorías del stack" (keydown)="onKey($event)">
    @for (g of groups; track g.title; let i = $index) {
      <button type="button" role="tab" [id]="'tab-' + i" [attr.aria-selected]="active() === i"
        [attr.aria-controls]="'panel-skills'" [attr.tabindex]="active() === i ? 0 : -1" [class.active]="active() === i"
        (click)="select(i)" [style.--tone]="g.tone">
        <span class="tab-kanji" aria-hidden="true">{{ g.kanji }}</span>
        <span class="tab-label">{{ g.title }}</span>
      </button>
    }
  </div>

  <div class="panel" id="panel-skills" role="tabpanel" [attr.aria-labelledby]="'tab-' + active()"
    [style.--tone]="groups[active()].tone">
    <span class="panel-kanji" aria-hidden="true">{{ groups[active()].kanji }}</span>
    <p class="panel-meaning" aria-hidden="true">{{ groups[active()].meaning }}</p>
    <ul class="pills">
      @for (s of groups[active()].skills; track s; let j = $index) {
        <li class="pill" [style.--rot]="rotations[j % rotations.length]">{{ s }}</li>
      }
    </ul>
  </div>

</section>
